---
    name: "release"
    
    on:
      push:
        tags:
          - "v*"
      workflow_dispatch:
        inputs:
          tag:
            description: 'Release tag (for example v2.3.9)'
            required: true
            type: string

    env:
      DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
      DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
      KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
      KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    jobs:
      flutter-test:
        runs-on: "ubuntu-latest"
        permissions:
          contents: read
        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
          - name: Get Flutter dependencies
            run: flutter pub get
            shell: bash
          - name: Install native build tools
            run: |
              sudo apt-get update
              sudo apt-get install -y build-essential cmake ninja-build
            shell: bash
          - name: Run Flutter tests
            run: |
              flutter test --concurrency=1 --reporter expanded || \
                flutter test --concurrency=1 --reporter expanded
            shell: bash

      flutter-analyze:
        runs-on: "ubuntu-latest"
        permissions:
          contents: read
        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
          - name: Get Flutter dependencies
            run: flutter pub get
            shell: bash
          - name: Analyze Flutter project
            run: flutter analyze --no-fatal-infos --fatal-warnings
            shell: bash

      flutter-build-android:
        name: "Release for android"
        needs: [flutter-test, flutter-analyze]
        runs-on: "ubuntu-latest" 
        permissions:
          contents: read
        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - name: Validate release tag
            run: |
              [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
            shell: bash
          - name: Echo build progress
            run: echo "Kazumi_android_${RELEASE_TAG}.apk build progress"
            shell: bash
          - name: Install dependencies
            run: |
              sudo apt-get update
              sudo apt-get install -y clang cmake ninja-build
            shell: bash
          - name: Set up JDK 17
            uses: actions/setup-java@v4
            with:
              java-version: '17'
              distribution: 'temurin'          
          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            id: flutter-action
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
          - name: Get Flutter dependencies
            run: flutter pub get
            shell: bash
          - name: Remove build id
            run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}/hosted/pub.dev/jni-*/src/CMakeLists.txt
          - name: Build Flutter for Android
            run: >-
              flutter build apk --flavor tv
              --dart-define=DANDANAPI_APPID=$DANDANAPI_APPID
              --dart-define=DANDANAPI_KEY=$DANDANAPI_KEY
              --dart-define=KAZUMI_APPID=$KAZUMI_APPID
              --dart-define=KAZUMI_KEY=$KAZUMI_KEY
            shell: bash
          - name: Package android build output
            run: cp build/app/outputs/flutter-apk/app-tv-release.apk "Kazumi_android_${RELEASE_TAG}.apk"
            shell: bash
          - name: Upload android outputs
            uses: actions/upload-artifact@v4
            with:
              name: android_outputs
              path: Kazumi_android_*.apk

      release:
        name: "Release"
        runs-on: "ubuntu-latest"
        needs: [flutter-build-android]
        permissions:
          contents: write
        steps:
          - name: Download android build file
            uses: actions/download-artifact@v4
            with:
              name: android_outputs
              path: release
          - name: Verify release artifact
            run: test -n "$(find release -maxdepth 1 -name 'Kazumi_android_*.apk' -print -quit)"
            shell: bash
          - name: Create release
            uses: softprops/action-gh-release@v2
            with:
              tag_name: ${{ env.RELEASE_TAG }}
              files: release/Kazumi_android_*.apk
