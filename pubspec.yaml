name: kazumi
description: "A new Flutter project."
publish_to: "none"
version: 2.3.9+20309

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: 3.47.6

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_modular: ^7.1.0
  mobx: ^2.6.0
  flutter_mobx: ^2.3.0
  dio: ^5.11.0
  cookie_jar: ^4.0.9
  crypto: ^3.0.6
  connectivity_plus: ^6.0.5

  path_provider: ^2.1.5
  hive_ce: ^2.16.0
  hive_ce_flutter: ^2.3.3
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  ech_http: ^0.2.1
  http: ^1.6.0
  image: ^4.8.0
  file_picker: ^10.3.7

  flutter_volume_controller: ^2.0.1
  audio_video_progress_bar: ^2.0.2
  audio_service: ^0.18.15
  audio_session: ^0.2.2
  dynamic_color: ^1.9.0
  flutter_displaymode: ^0.6.0

  url_launcher: ^6.3.0
  xpath_selector: ^3.0.2
  xpath_selector_html_parser: ^3.0.1
  json_path: ^0.9.0

  canvas_danmaku: ^0.3.3
  webdav_client: ^1.2.2
  dlna_dart: ^0.0.8
  logger: ^2.6.2
  flutter_rating_bar: ^4.0.1
  scrollview_observer: ^1.22.0
  saver_gallery: ^4.1.0
  screen_brightness_android: ^2.1.3
  screen_brightness_platform_interface: ^2.1.0
  synchronized: any
  flutter_svg: ^2.2.3
  antlr4: ^4.13.2
  fl_chart: ^1.1.1
  flutter_foreground_task: ^9.0.0
  skeletonizer: ^2.1.2
  flutter_inappwebview_platform_interface: ^1.3.0+1
  flutter_inappwebview_android: ^1.1.3
  open_filex: ^4.7.0
  html: any
  material_color_utilities: any
  material_new_shapes: ^1.0.0
  path: any
  photo_view: ^0.15.0
  image_picker: ^1.2.1
  media_kit:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: 803c4a27912091db6f839d48d1b984a0d9f588c7
      path: ./media_kit
  media_kit_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: 803c4a27912091db6f839d48d1b984a0d9f588c7
      path: ./media_kit_video

dev_dependencies:
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  mobx_codegen: ^2.7.5
  hive_ce_generator: ^1.10.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path_android: assets/images/logo/logo_android.png
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/images/logo/logo_android.png
  adaptive_icon_monochrome: assets/images/logo/logo_android.png

flutter:
  uses-material-design: true
  # tv is the only product flavor, so plain `flutter build` targets it.
  default-flavor: tv
  assets:
    - assets/images/
    - assets/plugins/
    - assets/shaders/
    - assets/images/logo/
    - assets/statements/
    - licenses/ech_http/
  fonts:
    - family: MI_Sans_Regular
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
