plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def pubspecVersionSuffix = ''
def pubspecFile = rootProject.file('../pubspec.yaml')
if (pubspecFile.exists()) {
    def versionSuffixMatcher = (pubspecFile.getText('UTF-8') =~ /(?m)^\s*version_suffix:\s*['\"]?([^#'\"\s]+)['\"]?\s*(?:#.*)?$/)
    if (versionSuffixMatcher.find()) {
        pubspecVersionSuffix = versionSuffixMatcher.group(1)
    }
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('key.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withReader('UTF-8') { reader ->
        signingProperties.load(reader)
    }
}

def signingProperty = { String name, String environmentName ->
    signingProperties.getProperty(name) ?: System.getenv(environmentName)
}

def releaseStoreFile = signingProperty('storeFile', 'ANDROID_KEYSTORE_PATH')
def releaseStorePassword = signingProperty('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingProperty('keyAlias', 'ANDROID_KEY_ALIAS')
def releaseKeyPassword = signingProperty('keyPassword', 'ANDROID_KEY_PASSWORD')
def releaseSigningConfigured = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { it }
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}

android {
    namespace "com.example.kazumi"
    compileSdk flutter.compileSdkVersion
    // Use the highest NDK required by the native plugins. Newer NDKs remain
    // backward compatible with plugins that declare an older version.
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.predidit.kazumi"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            } else if (releaseTaskRequested) {
                throw new GradleException(
                    'Release signing is not configured. Set key.properties or ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD.'
                )
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    // The tv flavor is the only build target, but it stays a flavor so that
    // `appFlavor` resolves to "tv" and isTvBuild remains true.
    flavorDimensions "device"
    productFlavors {
        tv {
            dimension "device"
            applicationIdSuffix ".tv"
            versionNameSuffix "-tv.${pubspecVersionSuffix}"
        }
    }
}

flutter {
    source '../..'
}

dependencies {}

// F-droid splits APKs by ABI, and requires different versionCode for each ABI.
// For flutter version X.Y.Z, version code is X0Y0ZA, where A is the ABI code.
// See:
// * https://developer.android.com/build/gradle-tips
// * https://developer.android.com/studio/build/configure-apk-splits
// * https://gitlab.com/fdroid/fdroiddata/-/blob/master/metadata/im.nfc.nfsee.yml
ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 4]
import com.android.build.OutputFile
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiVersionCode = project.ext.abiCodes.get(output.getFilter(OutputFile.ABI))
        if (abiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode * 10 + abiVersionCode
        }
    }
}
